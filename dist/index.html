<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <title>MONO · 私人财富管理</title>
  <meta name="description" content="在 MONO 查看净资产、资产配置与财富目标。">
  <link rel="icon" href="./mono.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./panels.css">
  <link rel="stylesheet" href="./dock.css">
  <link rel="stylesheet" href="./batch.css">
  <link rel="stylesheet" href="./backup.css">
  <link rel="stylesheet" href="./changes.css">
  <link rel="stylesheet" href="./interactions.css">
  <script defer src="./motion.js"></script>
  <script defer src="./trend.js"></script>
  <script defer src="./panels.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./backup-store.js"></script>
  <script defer src="./backup.js"></script>
</head>
<body>
  <header class="topbar"><div class="bar-inner">
    <a href="#overview" class="brand" aria-label="MONO 首页"><img class="brand-mark" src="./mono.svg?v=2" alt="" width="32" height="32"><span>MONO</span></a>
    <nav aria-label="主导航" class="mainnav">
      <a href="#overview" data-page="overview" aria-label="财富总览"><i data-icon="grid"></i><span class="nav-label">总览</span></a>
      <a href="#accounts" data-page="accounts" aria-label="资产账户"><i data-icon="wallet"></i><span class="nav-label">账户</span></a>
      <a href="#goals" data-page="goals" aria-label="财富目标"><i data-icon="target"></i><span class="nav-label">目标</span></a>
      <button class="dock-add" type="button" id="dockAdd" aria-haspopup="dialog" aria-label="记收支或添加账户" title="记收支或添加账户"><i data-icon="plus"></i></button>
    </nav>
    <div class="profile-wrap"><button class="profile" id="profileBtn" aria-label="个人空间" aria-expanded="false" aria-controls="profileMenu"><span class="avatar">M</span><span class="profile-label">个人空间</span><i data-icon="chevron"></i></button>
      <div class="profile-menu" id="profileMenu" hidden><strong>个人空间</strong><p>数据保存在当前浏览器</p>
        <button id="menuTheme" type="button" role="switch" aria-checked="true"><i data-icon="moon"></i><span>深色模式</span><span class="theme-switch" aria-hidden="true"></span></button>
        <button id="menuPrivacy"><i data-icon="eye"></i><span>隐藏金额</span></button>
        <button id="localBackup" type="button"><i data-icon="archive"></i>本地备份</button>
        <button id="restoreBackup" type="button"><i data-icon="restore"></i>恢复备份</button>
        <button id="startPersonal"><i data-icon="wallet"></i>启用我的资产空间</button>
        <button id="resetData" type="button" aria-haspopup="dialog" aria-controls="resetDialog"><i data-icon="trash"></i>重置数据</button>
      </div>
    </div>
  </div></header>
  <main>
    <div id="overview">
      <section class="page-head"><div><h1>财富总览</h1><div class="date"><time datetime="2026-11-21">2026年11月21日</time></div></div>
        <div class="overview-actions">
          <button class="mp-secondary" type="button" id="addAsset"><i data-icon="plus"></i>添加账户</button>
          <button class="mp-primary" type="button" id="overviewEntry" aria-haspopup="dialog"><i data-icon="entry"></i>记收支</button>
        </div>
      </section>
      <section class="balance-card" aria-labelledby="balanceTitle">
        <div class="balance-info">
          <div class="balance-title"><h2 id="balanceTitle">总净资产</h2><span class="currency-tag">CNY</span><button class="eye-btn" id="togglePrivacy" aria-label="隐藏金额" title="隐藏金额"><i data-icon="eye"></i></button></div>
          <div class="net-row" id="netValue" data-amount-key="net"></div>
          <div class="balance-bottom">
            <span id="weekMovement"><i aria-hidden="true"></i><span id="weekAmount" data-amount-key="week"></span></span>
            <span class="week-period">近 7 天</span>
          </div>
          <div class="balance-breakdown" aria-label="资产与负债明细">
            <div class="balance-stat">
              <span class="balance-stat-label">资产总额</span>
              <strong class="balance-stat-value" id="grossValue" data-amount-key="gross"></strong>
            </div>
            <div class="balance-stat">
              <span class="balance-stat-label">负债总额</span>
              <strong class="balance-stat-value" id="debtValue" data-amount-key="debt"></strong>
            </div>
          </div>
        </div>
      </section>
      <div class="analytics">
        <section class="panel trend-panel">
          <div class="panel-title"><h2>净资产走势</h2></div>
          <button class="performance change-button" id="changeDetailsButton" type="button" aria-label="查看净资产变动明细" aria-describedby="changeValue changePct periodCaption" aria-expanded="false" aria-controls="changeDetails"><span id="changeValue" data-amount-key="trend"></span><span id="changePct"></span><i data-icon="chevron"></i></button>
          <div class="stat-caption" id="periodCaption">近一年净资产增长</div>
          <div id="trendPlot" aria-label="净资产历史趋势图"></div>
          <div class="range-switch" role="group" aria-label="走势时间范围">
            <button data-range="ALL">全部</button><button data-range="1M">1个月</button><button data-range="3M">3个月</button><button data-range="6M">6个月</button><button data-range="1Y">1年</button>
          </div>
          <section id="changeDetails" class="change-details" aria-label="净资产变动明细" hidden></section>
        </section>
        <section class="panel allocation-panel">
          <div class="panel-title"><h2>资产配置</h2></div>
          <div class="donut-wrap"><svg viewBox="0 0 180 180" id="allocationDonut" role="img" aria-label="资产类别占比"></svg><div class="donut-center"><span><b id="classCount">4</b> 类</span><small>资产类别</small></div></div>
          <div id="allocationLegend" class="alloc-legend"></div>
        </section>
      </div>
      <section class="panel accounts-panel">
        <div class="panel-title"><div class="section-name"><h2>资产账户</h2><span class="count" id="accountCount"></span></div><a class="view-all" href="#accounts">查看全部</a></div>
        <div class="table-scroll"><table class="asset-table"><thead><tr><th>账户名称</th><th>资产类别</th><th class="align-right">账户余额</th><th class="share-column">资产占比</th><th class="end-cell"></th></tr></thead><tbody id="accountRows"></tbody></table></div>
      </section>
    </div>
    <div id="secondary" hidden></div>
  </main>
  <footer id="dataNote" role="status"></footer>
  <dialog class="mp-dialog quick-actions" id="quickActions" aria-label="快捷操作" autofocus>
    <form method="dialog">
      <div class="quick-action-list">
        <button value="entry"><i data-icon="entry"></i>记收支</button>
        <button value="account"><i data-icon="plus"></i>添加账户</button>
      </div>
      <button class="quick-cancel" value="cancel">取消</button>
    </form>
  </dialog>
  <dialog class="start-dialog" id="startDialog" aria-labelledby="startTitle"><h2 id="startTitle">启用我的资产空间</h2><p>从空白账户和目标开始，按天保存自己的净资产记录。此操作将替换当前示例和对示例的修改。</p><p id="startError" role="alert"></p><div><button id="cancelStart" autofocus>取消</button><button class="primary" id="confirmStart">从空白开始</button></div></dialog>
  <dialog class="start-dialog" id="resetDialog" aria-labelledby="resetTitle" aria-describedby="resetDescription">
    <h2 id="resetTitle">重置所有数据？</h2>
    <p id="resetDescription">将清空当前浏览器中的资产账户、财富目标和历史记录，并恢复默认设置。已有的本地备份会保留。</p>
    <p>请等待 5 秒后再确认。</p>
    <p id="resetError" role="alert"></p>
    <div>
      <button type="button" id="cancelReset" autofocus>取消</button>
      <button type="button" id="confirmReset" class="primary" disabled>确认重置（5 秒）</button>
    </div>
  </dialog>
</body>
</html>
